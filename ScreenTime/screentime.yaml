limit_minutes: 15
cooldown_minutes: 15

# Zeitfenster in denen das Limit nicht gilt
# Optionales "days"-Feld schränkt auf bestimmte Wochentage ein (mo di mi do fr sa so).
# Ohne "days" gilt das Fenster täglich.
# unlimited:
#   - from: "12:00"
#     to: "13:00"
#     days: [mo, di, mi, do, fr] # nur Mo–Fr
#   - from: "00:00"
#     to: "23:59"
#     days: [sa, so] # ganzer Sa und So
unlimited:
  - from: "20:00"
    to: "00:00"
    days: [mo, di, mi, do, fr] # Wochentags
  - from: "08:30"
    to: "10:00"
    days: [sa, so] # Wochenende

apps:
  - name: mpv
    limit_mode: soft
    title_blacklist:
      - PixelDiskOne-Splash
      - Backgroundmusic
  - name: retroarch
    limit_mode: hard

# Benachrichtigung wenn X% der Limit-Zeit VERBLEIBEN
notify_thresholds_remaining_percent:
  - 30
  - 10
  - 5

notification_icon: sprites/sanduhr.png

nag_screen:
  character_sprite: sprites/mario.gif
  character_offset_y: 30
  character_size: [72, 72]
  goal_sprite: sprites/castle.png
  goal_offset_y: 0
  goal_size: [110, 130]
  item_sprite: sprites/coin.gif
  item_offset_y: 40
  item_size: [20, 20]
  item_count: 8
  ready_sprite: sprites/ready.gif
  ready_sprite_offset_y: 0
  ready_sprite_size: [200, 200]
